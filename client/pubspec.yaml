name: client
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/audio/
    - assets/Inter/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icons/app_icon.jpg"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.jpg"
    background_color: "#111111"
    theme_color: "#111111"
