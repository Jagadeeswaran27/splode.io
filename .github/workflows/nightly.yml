name: Build & Release Splode APK

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE20: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore .env File
        working-directory: client
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}
          EOF

      - name: Install Dependencies
        working-directory: client
        run: flutter pub get

      - name: Run Static Analysis
        working-directory: client
        run: dart analyze lib/

      - name: Run Unit Tests
        working-directory: client
        run: flutter test

  build_and_release:
    name: Build & Publish Release APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Android Keystore & Config
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          # 1. Decode Keystore
          mkdir -p client/android/app
          echo "$KEYSTORE_BASE64" | base64 -d > client/android/app/upload-keystore.jks

          # 2. Write key.properties
          cat <<EOF > client/android/key.properties
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=upload-keystore.jks
          EOF

          # 3. Write client/.env
          cat <<EOF > client/.env
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}
          EOF

      - name: Install Dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Release APK
        working-directory: client
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          cp client/build/app/outputs/flutter-apk/app-release.apk splode-v0.1.0-b${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Splode Latest Build (Run #${{ github.run_number }})"
          body: |
            Automated build updated on commit `${{ github.sha }}`.

            - **Built on**: $(date -u +'%Y-%m-%d %H:%M UTC')
            - **Run Number**: #${{ github.run_number }}

            ### Included Artifacts
            - `app-release.apk` (Signed Release Build)
            - `splode-v0.1.0-b${{ github.run_number }}.apk` (Unique build-numbered APK)
          draft: false
          prerelease: false
          files: |
            client/build/app/outputs/flutter-apk/app-release.apk
            splode-v0.1.0-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
